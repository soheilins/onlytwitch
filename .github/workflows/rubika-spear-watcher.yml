name: Rubika – Spear Folder Watcher (6h runs, every 6h)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  rubika-watcher:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Watch 'spear' folder and send files to Rubika
        env:
          RUBIKA_BOT_TOKEN: ${{ secrets.RUBIKA_BOT_TOKEN }}
          RUBIKA_CHAT_ID: ${{ secrets.RUBIKA_CHAT_ID }}
        run: |
          set -euo pipefail

          FOLDER="spear"
          WAIT_SECONDS=60
          MAX_DURATION=21600

          # ------------------------------------------------------------
          # Helper: send a plain text message
          # ------------------------------------------------------------
          send_text() {
            local text="$1"
            curl -s -X POST "https://botapi.rubika.ir/v3/${RUBIKA_BOT_TOKEN}/sendMessage" \
              -H 'Content-Type: application/json' \
              -d "{\"chat_id\":\"$RUBIKA_CHAT_ID\",\"text\":\"$text\"}"
          }

          # ------------------------------------------------------------
          # Upload file with retry – logs each failure before retry
          # ------------------------------------------------------------
          upload_file_with_retry() {
            local file_path="$1"
            local file_type="File"

            while true; do
              echo "  → Requesting upload URL..."
              local upload_url_response
              upload_url_response=$(curl -s --max-time 10 -X POST "https://botapi.rubika.ir/v3/${RUBIKA_BOT_TOKEN}/requestSendFile" \
                -H 'Content-Type: application/json' \
                -d "{\"type\":\"$file_type\"}" 2>&1 | tr -d '\r' | sed 's/^\xEF\xBB\xBF//')

              if [ $? -ne 0 ] || [ -z "$upload_url_response" ]; then
                echo "  ⚠️ Upload URL request failed, retrying in 1s..."
                sleep 1
                continue
              fi

              local upload_url
              upload_url=$(echo "$upload_url_response" | jq -r '.data.upload_url // empty' 2>/dev/null || echo "")
              
              if [ -z "$upload_url" ]; then
                echo "  ⚠️ No upload_url in response, retrying in 1s..."
                sleep 1
                continue
              fi

              echo "  → Uploading file to Rubika..."
              local upload_response
              upload_response=$(curl -s --max-time 30 -X POST "$upload_url" \
                -F "file=@$file_path" 2>&1 | tr -d '\r' | sed 's/^\xEF\xBB\xBF//')
              
              if [ $? -ne 0 ] || [ -z "$upload_response" ]; then
                echo "  ⚠️ File upload request failed, retrying in 1s..."
                sleep 1
                continue
              fi

              local file_id
              file_id=$(echo "$upload_response" | jq -r '.data.file_id // empty' 2>/dev/null || echo "")
              if [ -n "$file_id" ]; then
                echo "$file_id"
                return 0
              else
                echo "  ⚠️ No file_id in upload response, retrying in 1s..."
                sleep 1
              fi
            done
          }

          # ------------------------------------------------------------
          # Send one file: first send its name as text, then upload+send
          # ------------------------------------------------------------
          send_one_file() {
            local file_path="$1"
            local filename=$(basename "$file_path")
            
            # 1. Send the file name as a text message
            echo "📝 Sending filename: $filename"
            send_text "📄 Sending: $filename"
            sleep 1   # brief pause to keep message order
            
            # 2. Upload and send the actual file
            echo "📤 Uploading and sending: $file_path"
            local file_id
            file_id=$(upload_file_with_retry "$file_path")
            echo "  → Sending file via sendFile..."
            curl -s -X POST "https://botapi.rubika.ir/v3/${RUBIKA_BOT_TOKEN}/sendFile" \
              -H 'Content-Type: application/json' \
              -d "{\"chat_id\":\"$RUBIKA_CHAT_ID\",\"file_id\":\"$file_id\",\"text\":\"$filename\"}"
            echo "  ✅ Sent."
            sleep 1
          }

          # ------------------------------------------------------------
          # Wait for folder with files
          # ------------------------------------------------------------
          echo "⏳ Waiting for folder '$FOLDER' to appear (checking every $WAIT_SECONDS seconds)..."
          while true; do
            if [ -d "$FOLDER" ]; then
              FILE_COUNT=$(find "$FOLDER" -type f | wc -l)
              if [ "$FILE_COUNT" -gt 0 ]; then
                echo "✅ Folder '$FOLDER' found with $FILE_COUNT file(s)."
                break
              else
                echo "📁 Folder '$FOLDER' exists but is empty. Waiting..."
              fi
            else
              echo "❌ Folder '$FOLDER' does not exist yet. Waiting..."
            fi
            sleep "$WAIT_SECONDS"
          done

          # ------------------------------------------------------------
          # Send all existing files (fresh start)
          # ------------------------------------------------------------
          find "$FOLDER" -type f | sort | while read -r file; do
            send_one_file "$file"
          done
          echo "✅ Initial files sent."

          # ------------------------------------------------------------
          # Continuous watch for new files (up to 6 hours)
          # ------------------------------------------------------------
          START_TIME=$SECONDS
          SENT_LIST=$(mktemp)
          find "$FOLDER" -type f >> "$SENT_LIST"

          echo "🔄 Watching for new files (checking every $WAIT_SECONDS seconds, up to 6h)..."
          while true; do
            ELAPSED=$(( SECONDS - START_TIME ))
            if [ $ELAPSED -ge $MAX_DURATION ]; then
              echo "⏰ 6 hours reached – stopping."
              break
            fi

            find "$FOLDER" -type f | sort | while read -r file; do
              if ! grep -Fxq "$file" "$SENT_LIST" 2>/dev/null; then
                send_one_file "$file"
                echo "$file" >> "$SENT_LIST"
              fi
            done
            sleep "$WAIT_SECONDS"
          done

          echo "🏁 Rubika watcher finished."
